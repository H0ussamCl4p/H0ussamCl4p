<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150" role="img" aria-label="Ferris the crab walking along a terminal line">
  <title>Ferris walking</title>
  <style>
    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace; white-space: pre; }
    .ink { fill: #ece8e1; font-size: 18px; font-weight: 700; }
    .red { fill: #e0262b; }
    .dim { fill: #8a857d; font-size: 13px; }
    .walk { animation: walk 10s ease-in-out infinite; }
    .bob { animation: bob .4s steps(1, end) infinite; }
    .fa { animation: fa .4s steps(1, end) infinite; }
    .fb { opacity: 0; animation: fb .4s steps(1, end) infinite; }
    .ca { animation: fa 1.1s steps(1, end) infinite; }
    .cb { opacity: 0; animation: fb 1.1s steps(1, end) infinite; }
    .open { animation: open 4.2s steps(1, end) infinite; }
    .shut { opacity: 0; animation: shut 4.2s steps(1, end) infinite; }
    .cursor { animation: fa 1s steps(1, end) infinite; }
    @keyframes walk {
      0%, 4% { transform: translateX(0); }
      46%, 54% { transform: translateX(590px); }
      96%, 100% { transform: translateX(0); }
    }
    @keyframes bob { 0% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes fa { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes fb { 0% { opacity: 0; } 50% { opacity: 1; } }
    @keyframes open { 0% { opacity: 1; } 92% { opacity: 0; } 96% { opacity: 1; } }
    @keyframes shut { 0% { opacity: 0; } 92% { opacity: 1; } 96% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .walk, .bob, .fa, .ca, .open, .cursor { animation: none; }
      .fb, .cb, .shut { animation: none; opacity: 0; }
    }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1f1d1b" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="840" height="150" rx="12" fill="#131211" />
  <rect width="840" height="150" rx="12" fill="url(#grid)" />

  <text class="dim" x="24" y="28">~/casablanca</text>
  <text class="dim" x="816" y="28" text-anchor="end">// cargo run --release<tspan class="red cursor"> ▌</tspan></text>
  <line x1="24" y1="134" x2="816" y2="134" stroke="#2a2826" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round" />

  <g transform="translate(32 56)">
    <g class="walk">
      <g class="bob">
        <text class="ink" y="0">    _~^~^~_</text>

        <g class="open">
          <text class="ink ca" y="22"><tspan class="red">\)</tspan> /  o o  \ <tspan class="red">(/</tspan></text>
          <text class="ink cb" y="22"><tspan class="red">\&gt;</tspan> /  o o  \ <tspan class="red">&lt;/</tspan></text>
        </g>
        <g class="shut">
          <text class="ink ca" y="22"><tspan class="red">\)</tspan> /  - -  \ <tspan class="red">(/</tspan></text>
          <text class="ink cb" y="22"><tspan class="red">\&gt;</tspan> /  - -  \ <tspan class="red">&lt;/</tspan></text>
        </g>

        <text class="ink" y="44">  '_   -   _'</text>
        <text class="ink fa" y="66">  / '-----' \</text>
        <text class="ink fb" y="66">  \ '-----' /</text>
      </g>
    </g>
  </g>
</svg>
